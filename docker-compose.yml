services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: avaliacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/schema/schema.sql:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      # 5433 no host para não conflitar com um Postgres local na 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avaliacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: avaliacao
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Monta o código para desenvolvimento (reflete alterações sem rebuild).
      # Remova este bloco se quiser usar apenas o que foi copiado na imagem.
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public

volumes:
  pgdata:
